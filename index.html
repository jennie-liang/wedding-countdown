<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>跨種族爬蟲整合實驗剪綵儀式倒數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="剪綵儀式倒數">
<style>
  :root {
    --plum-top: #e3e9ec;
    --plum-bottom: #c1cdd2;
    --sheet-bg: #fbfcfc;
    --sheet-bg-2: #f0f4f5;
    --ink: #3f4b53;
    --muted: #8a969d;
    --muted-on-sheet: #7c8791;
    --gold: #5f7b8a;
    --gold-deep: #435864;
    --ember-1: #ff8a3d;
    --ember-2: #ffcf5c;
    --ember-3: #ff5a3c;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--plum-top);
    font-family: 'Manrope', system-ui, sans-serif;
    color: var(--ink);
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(255, 185, 120, 0.18), transparent 60%),
      linear-gradient(180deg, var(--plum-top) 0%, var(--plum-bottom) 100%);
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.4;
  }
  .glow--a { width: 260px; height: 260px; top: -60px; right: -60px; background: var(--ember-2); opacity: 0.3; }
  .glow--b { width: 220px; height: 220px; top: 30%; left: -80px; background: var(--gold); opacity: 0.14; }

  .backdrop {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    overflow-y: auto;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 28px calc(28px + env(safe-area-inset-bottom, 0px));
  }

  .kicker {
    font-family: 'Fraunces', serif;
    font-style: normal;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.45;
    text-align: center;
    letter-spacing: -0.005em;
    text-wrap: balance;
    color: var(--ink);
  }

  .content-card {
    width: 100%;
    background: var(--sheet-bg);
    border-radius: 24px;
    padding: 6px 18px 18px;
    box-shadow: 0 20px 44px -24px rgba(50, 63, 71, 0.45);
  }

  .card-divider {
    height: 1px;
    background: rgba(63, 75, 83, 0.1);
    margin: 4px 0 8px;
  }

  .enter-btn {
    margin-top: auto;
    padding: 17px 38px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--ember-1), var(--ember-3));
    color: #fff8f0;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.02em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 16px 32px -12px rgba(255, 90, 60, 0.6);
    transition: transform 0.15s ease;
  }

  .enter-btn:active { transform: scale(0.96); }

  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: calc(100% - 20px);
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(140% 100% at 50% 0%, var(--sheet-bg-2), var(--sheet-bg) 55%);
    border-radius: 32px 32px 0 0;
    box-shadow: 0 -20px 50px -20px rgba(20, 5, 15, 0.5);
    transform: translateY(100%);
    pointer-events: none;
    transition: transform 0.55s cubic-bezier(.22,.68,0,1.01);
  }

  .sheet.is-open {
    transform: translateY(0);
    pointer-events: auto;
  }

  .sheet.is-dragging {
    transition: none;
  }

  .grabber-wrap {
    flex: 0 0 auto;
    padding: 14px 0 6px;
    touch-action: none;
    cursor: grab;
  }

  .grabber {
    width: 40px;
    height: 5px;
    border-radius: 3px;
    background: rgba(58, 65, 71, 0.18);
    margin: 0 auto;
  }

  .sheet-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 28px calc(34px + env(safe-area-inset-bottom, 0px));
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 25px;
    line-height: 1.35;
    text-align: center;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 26px;
  }

  .fire-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 26px;
  }

  .fire-btn {
    position: relative;
    width: 116px;
    height: 116px;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #ffe2b0 0%, #ffb35c 38%, #ff7a3d 68%, transparent 72%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: flicker 2.6s ease-in-out infinite;
  }

  .fire-btn:active { transform: scale(0.94); }

  .fire-btn .emoji {
    font-size: 56px;
    transform-origin: 50% 90%;
    animation: sway 0.55s ease-in-out infinite alternate;
  }

  @keyframes flicker {
    0%, 100% { filter: brightness(1); box-shadow: 0 0 24px 6px rgba(255, 138, 61, 0.35); }
    50%      { filter: brightness(1.12); box-shadow: 0 0 34px 12px rgba(255, 138, 61, 0.5); }
  }

  @keyframes sway {
    from { transform: rotate(-4deg) scale(0.94); }
    to   { transform: rotate(4deg) scale(1.08); }
  }

  @media (prefers-reduced-motion: reduce) {
    .fire-btn, .fire-btn .emoji { animation: none; }
    .sheet { transition: none; }
  }

  .countdown-label {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted-on-sheet);
    margin-bottom: 14px;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    background: rgba(58, 65, 71, 0.05);
    border-radius: 20px;
    padding: 16px 10px;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .unit .value {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 30px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1;
  }

  .unit .unit-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted-on-sheet);
  }

  .date-pill {
    display: block;
    width: fit-content;
    margin: 20px auto 0;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(127, 150, 163, 0.16);
    color: var(--gold-deep);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 4px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    font-weight: 700;
    font-size: 15.5px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn:active { background: rgba(63, 75, 83, 0.05); }

  .link-icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: rgba(95, 123, 138, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .link-label { flex: 1; }

  .link-chevron {
    flex: 0 0 auto;
    font-size: 17px;
    color: var(--muted-on-sheet);
  }

  .todo-section {
    width: 100%;
  }

  .todo-heading {
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-on-sheet);
    margin-bottom: 10px;
  }

  .todo-form {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .todo-input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1.5px solid rgba(63, 75, 83, 0.14);
    background: #ffffff;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }

  .todo-input::placeholder {
    color: rgba(63, 75, 83, 0.35);
  }

  .todo-input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .todo-add {
    flex: 0 0 auto;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    background: var(--gold);
    color: #fbfcfc;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .todo-add:active { background: var(--gold-deep); }

  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(63, 75, 83, 0.05);
    border-radius: 12px;
  }

  .todo-item label {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }

  .todo-check {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--gold);
  }

  .todo-text {
    font-size: 14px;
    color: var(--ink);
    word-break: break-word;
  }

  .todo-text.done {
    text-decoration: line-through;
    color: var(--muted-on-sheet);
  }

  .todo-remove {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: var(--muted-on-sheet);
    font-size: 18px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .todo-empty {
    text-align: center;
    font-size: 13px;
    color: var(--muted-on-sheet);
    padding: 8px 0 4px;
  }
</style>
</head>
<body>

<div class="frame">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>

  <div class="backdrop">
    <div class="kicker">跨種族爬蟲整合實驗剪綵儀式倒數</div>

    <div class="content-card">
      <a class="link-btn" href="https://docs.google.com/spreadsheets/d/10-rwFnDmvjIPv4MM4_fLahjTVeppy5KAVNHJ5Z1zEx4/edit?usp=drive_link" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">📋</span>
        <span class="link-label">籌備進度表</span>
        <span class="link-chevron" aria-hidden="true">›</span>
      </a>

      <div class="card-divider"></div>

      <div class="todo-section">
        <div class="todo-heading">待辦事項</div>
        <form class="todo-form" id="todoForm">
          <input class="todo-input" id="todoInput" type="text" placeholder="新增一項待辦事項" autocomplete="off">
          <button class="todo-add" type="submit">新增</button>
        </form>
        <ul class="todo-list" id="todoList"></ul>
      </div>
    </div>

    <button class="enter-btn" type="button" id="enterBtn">我現在不爽</button>
  </div>

  <div class="sheet" id="sheet">
    <div class="grabber-wrap" id="grabberWrap">
      <div class="grabber"></div>
    </div>

    <div class="sheet-body">
      <p class="headline">婚禮工人工作！<br>不要生氣！</p>

      <div class="fire-wrap">
        <button class="fire-btn" type="button" aria-label="加油打氣">
          <span class="emoji">🔥</span>
        </button>
      </div>

      <div class="countdown-label">距離婚禮還有</div>
      <div class="countdown">
        <div class="unit"><span class="value" id="d">00</span><span class="unit-label">天</span></div>
        <div class="unit"><span class="value" id="h">00</span><span class="unit-label">時</span></div>
        <div class="unit"><span class="value" id="m">00</span><span class="unit-label">分</span></div>
        <div class="unit"><span class="value" id="s">00</span><span class="unit-label">秒</span></div>
      </div>

      <span class="date-pill">2026 / 11 / 22</span>
    </div>
  </div>
</div>

<script>
  (function () {
    var target = new Date(2026, 10, 22, 0, 0, 0);
    var els = {
      d: document.getElementById('d'),
      h: document.getElementById('h'),
      m: document.getElementById('m'),
      s: document.getElementById('s')
    };

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      var diff = target.getTime() - Date.now();
      if (diff < 0) diff = 0;
      var totalSeconds = Math.floor(diff / 1000);
      var days = Math.floor(totalSeconds / 86400);
      var hours = Math.floor((totalSeconds % 86400) / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;

      els.d.textContent = days;
      els.h.textContent = pad(hours);
      els.m.textContent = pad(minutes);
      els.s.textContent = pad(seconds);
    }

    tick();
    setInterval(tick, 1000);

    var sheet = document.getElementById('sheet');

    document.getElementById('enterBtn').addEventListener('click', function () {
      sheet.classList.add('is-open');
    });

    // Swipe-down-to-dismiss on the grabber
    (function () {
      var grabberWrap = document.getElementById('grabberWrap');
      var startY = 0;
      var dragging = false;
      var DISMISS_THRESHOLD = 110;

      function onPointerMove(e) {
        if (!dragging) return;
        var delta = e.clientY - startY;
        if (delta < 0) delta = 0;
        sheet.style.transform = 'translateY(' + delta + 'px)';
      }

      function onPointerUp(e) {
        if (!dragging) return;
        dragging = false;
        sheet.classList.remove('is-dragging');
        var delta = Math.max(0, e.clientY - startY);
        sheet.style.transform = '';
        if (delta > DISMISS_THRESHOLD) {
          sheet.classList.remove('is-open');
        }
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
      }

      grabberWrap.addEventListener('pointerdown', function (e) {
        dragging = true;
        startY = e.clientY;
        sheet.classList.add('is-dragging');
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
      });
    })();

    // Self-managed to-do list, persisted per-device
    (function () {
      var STORAGE_KEY = 'wedding-countdown-todos';
      var form = document.getElementById('todoForm');
      var input = document.getElementById('todoInput');
      var list = document.getElementById('todoList');
      var todos = [];

      function load() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          todos = raw ? JSON.parse(raw) : [];
        } catch (e) {
          todos = [];
        }
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch (e) {}
      }

      function render() {
        list.innerHTML = '';
        if (todos.length === 0) {
          var empty = document.createElement('li');
          empty.className = 'todo-empty';
          empty.textContent = '目前沒有待辦事項，新增一項吧';
          list.appendChild(empty);
          return;
        }
        todos.forEach(function (todo) {
          var li = document.createElement('li');
          li.className = 'todo-item';

          var label = document.createElement('label');

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'todo-check';
          checkbox.checked = todo.done;
          checkbox.addEventListener('change', function () {
            todo.done = checkbox.checked;
            save();
            render();
          });

          var text = document.createElement('span');
          text.className = 'todo-text' + (todo.done ? ' done' : '');
          text.textContent = todo.text;

          label.appendChild(checkbox);
          label.appendChild(text);

          var remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'todo-remove';
          remove.setAttribute('aria-label', '刪除待辦事項');
          remove.textContent = '×';
          remove.addEventListener('click', function () {
            todos = todos.filter(function (t) { return t.id !== todo.id; });
            save();
            render();
          });

          li.appendChild(label);
          li.appendChild(remove);
          list.appendChild(li);
        });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        todos.push({ id: Date.now() + '-' + Math.random(), text: text, done: false });
        input.value = '';
        save();
        render();
      });

      load();
      render();
    })();
  })();
</script>
</body>
</html>
